# FishWIO reef fish demonstration experiment with real frozen DINOv3 weights
experiment:
  name: fishwio_dinov3_demo
  seeds: [42]
  device: auto  # auto selects cuda, mps, or cpu

data:
  manifest_path: data/manifests/fishwio_demo.csv
  raw_root: data/raw
  datasets:
    - fishwio
  max_crops_per_video: 3
  max_images_per_species: 15
  use_foreground_mask: false
  equalize_resolution: null

model:
  backbone: dinov3_vitb16
  pooling: cls
  batch_size: 32
  image_size: 224
  l2_normalize: true
  cache_dir: outputs/embeddings

reduction:
  methods:
    - pca
    - tsne
    - umap
  n_components: 2
  tsne_perplexity: 30
  umap_n_neighbors: 15
  umap_min_dist: 0.1

clustering:
  methods:
    - hdbscan
    - ward
    - kmeans
    - gmm
  hdbscan_min_cluster_size: 10
  run_in_high_dim: true

evaluation:
  compute_projection_quality: true
  k_neighbors: 15
  compute_label_free: true
  compute_rq2_mixing: false
  output_dir: outputs/metrics

visualization:
  export_html: true
  output_dir: outputs/visual_atlas

cropping:
  detector: none
  confidence_threshold: 0.35
